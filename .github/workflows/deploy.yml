name: Auto Deploy to Oracle

on:
  push:
    branches:
      - main  # This script runs whenever you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/amg-data
            git pull origin main
            npm install
            # Try to restart. If it fails (e.g. process not found), it won't stop the Action.
            pm2 restart amg-bot || pm2 start server.js --name "amg-bot" || true
            pm2 save