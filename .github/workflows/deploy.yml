name: Auto Deploy to Oracle

on:
  push:
    branches:
      - main  # This script runs whenever you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/amg-data
            git fetch --all
            git reset --hard origin/main
            npm install
            
            # Restart the API Server [1]
            pm2 restart amg-api || pm2 start server.js --name "amg-api"
            
            # Restart the WhatsApp Bot [1]
            pm2 restart amg-bot || pm2 start bot.js --name "amg-bot"
            
            pm2 save