name: Auto Deploy to Contabo

on:
  push:
    branches:
      - main  # Runs whenever you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # FIXED: Uses your Contabo Password! [1]
          timeout: 20m
          script: |
            # 1. Move into the Contabo root folder
            cd /root/amg-data
            
            # 2. Force the server to pull the new code [1]
            git fetch --all
            git reset --hard origin/main
            
            # 3. Install packages [1]
            npm install --no-audit --no-fund
            
            # 4. Restart both processes in the root user's PM2 list [1]
            pm2 restart amg-api || pm2 start server.js --name "amg-api"
            pm2 restart amg-bot || pm2 start bot.js --name "amg-bot"
            pm2 save